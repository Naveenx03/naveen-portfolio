<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>To-Do App</title>
</head>
<body class='d-flex align-items-center vh-100'>
<div class='container border w-50 bg-success-subtle'>
    <h1 class='text-center'>My To-Do List</h1>
    <div class='d-flex justify-content-center'>
    <div class='mx-auto'>
    <form method='POST'>
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit" class='btn btn-primary'>Add Task</button>
    </form>
    <ol>
        {% for task in tasks%}
            <li class='mb-2'> 
                {{task.title}} {%if task.completed%} Done!{%else%} Pending! {%endif%}
                <a href="{%url 'update_task' task.id%}"><button class='btn btn-info'>Edit</button></a>
                <a href="{%url 'delete_task' task.id%}"><button class='btn btn-danger'>Delete</button><a>
            </li>
        {% endfor %}
    </ol>
        </div>
    </div>
</div>
</body>
</html>
